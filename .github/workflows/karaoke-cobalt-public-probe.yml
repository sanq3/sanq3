name: Karaoke opt-in cobalt probe

on:
  push:
    paths:
      - "karaoke/probe_cobalt_public.py"
      - ".github/workflows/karaoke-cobalt-public-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --upgrade requests
      - name: Probe opt-in community instances without retaining media
        run: python karaoke/probe_cobalt_public.py
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-cobalt-public-probe
          path: karaoke/cobalt-public-probe.json
          if-no-files-found: error
          retention-days: 1
