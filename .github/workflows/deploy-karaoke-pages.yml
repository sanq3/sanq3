name: Deploy karaoke site

on:
  push:
    branches: [main]
    paths:
      - "karaoke/site.tar.gz.b64"
      - ".github/workflows/deploy-karaoke-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Unpack verified static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          base64 --decode karaoke/site.tar.gz.b64 > /tmp/karaoke-site.tar.gz
          echo "c44ee116f6ae6d35bb4c52dac36234c4e69a0fccd63ee162b6e6587c699e24e3  /tmp/karaoke-site.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/karaoke-site.tar.gz -C _site
          test -f _site/index.html
          test -f _site/karaoke/index.html
          test -f _site/karaoke/songs.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
