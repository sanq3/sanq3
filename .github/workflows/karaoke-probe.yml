name: Karaoke source probe

on:
  push:
    paths:
      - "karaoke/probe_sources.py"
      - ".github/workflows/karaoke-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install --upgrade yt-dlp requests
      - name: Probe public video metadata and captions
        run: python karaoke/probe_sources.py
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-probe
          path: karaoke/probe-output/probe.json
          if-no-files-found: error
          retention-days: 1
