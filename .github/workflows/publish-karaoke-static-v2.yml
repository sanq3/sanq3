name: Publish karaoke static files v2

on:
  push:
    branches: [main]
    paths:
      - "karaoke/site-parts/**"
      - ".github/workflows/publish-karaoke-static-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack and verify static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public-karaoke /tmp/karaoke-static
          mkdir -p /tmp/karaoke-static
          cat karaoke/site-parts/part-* | base64 --decode > /tmp/karaoke-site.tar.gz
          echo "c44ee116f6ae6d35bb4c52dac36234c4e69a0fccd63ee162b6e6587c699e24e3  /tmp/karaoke-site.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/karaoke-site.tar.gz -C /tmp/karaoke-static
          cp -a /tmp/karaoke-static/karaoke public-karaoke
          test -f public-karaoke/index.html
          test -f public-karaoke/app.js
          test -f public-karaoke/songs.js
          test -f public-karaoke/styles.css
          grep -q "韓国語カラオケ練習" public-karaoke/index.html
          node --check public-karaoke/app.js
          node --check public-karaoke/songs.js

      - name: Commit generated static files
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-karaoke
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish mobile karaoke static site"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify public mobile page
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.commit.outputs.sha }}"
          RAWGITHACK="https://raw.githack.com/${GITHUB_REPOSITORY}/${SHA}/public-karaoke/index.html"
          JSDELIVR="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${SHA}/public-karaoke/index.html"

          verify_url() {
            local url="$1"
            for attempt in $(seq 1 18); do
              if curl --fail --location --silent --show-error --max-time 30 "$url" -o /tmp/public-index.html \
                 && grep -q "韓国語カラオケ練習" /tmp/public-index.html; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          if verify_url "$RAWGITHACK"; then
            BASE="https://raw.githack.com/${GITHUB_REPOSITORY}/${SHA}/public-karaoke"
          elif verify_url "$JSDELIVR"; then
            BASE="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${SHA}/public-karaoke"
          else
            echo "Neither public gateway served the page" >&2
            exit 1
          fi

          curl --fail --location --silent --show-error --max-time 30 "$BASE/app.js" -o /tmp/public-app.js
          curl --fail --location --silent --show-error --max-time 30 "$BASE/songs.js" -o /tmp/public-songs.js
          curl --fail --location --silent --show-error --max-time 30 "$BASE/styles.css" -o /tmp/public-styles.css
          node --check /tmp/public-app.js
          node --check /tmp/public-songs.js
          test "$(wc -c < /tmp/public-songs.js)" -gt 60000

          echo "PUBLIC_URL=$BASE/index.html"
          echo "PUBLIC_SHA=$SHA"
