name: Karaoke fetch timestamped transcripts

on:
  push:
    paths:
      - "karaoke/fetch_notegpt_transcripts.py"
      - ".github/workflows/karaoke-fetch-transcripts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --upgrade requests
      - name: Fetch public timestamped transcripts
        run: python karaoke/fetch_notegpt_transcripts.py
      - name: Upload transcript bundle
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-notegpt-transcripts
          path: karaoke/notegpt-transcripts
          if-no-files-found: error
          retention-days: 1
