name: Karaoke YouTube embed probe

on:
  push:
    paths:
      - "karaoke/probe_youtube_embed.py"
      - ".github/workflows/karaoke-youtube-embed-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade playwright
          python -m playwright install --with-deps chromium
      - name: Probe privacy-enhanced YouTube embeds
        run: python karaoke/probe_youtube_embed.py
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-youtube-embed-probe
          path: karaoke/youtube-embed-output
          if-no-files-found: error
          retention-days: 1
