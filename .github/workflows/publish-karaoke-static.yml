name: Publish karaoke static files

on:
  push:
    branches: [main]
    paths:
      - "karaoke/site.tar.gz.b64"
      - ".github/workflows/publish-karaoke-static.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack verified site into repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public-karaoke /tmp/karaoke-static
          mkdir -p /tmp/karaoke-static
          base64 --decode karaoke/site.tar.gz.b64 > /tmp/karaoke-site.tar.gz
          echo "c44ee116f6ae6d35bb4c52dac36234c4e69a0fccd63ee162b6e6587c699e24e3  /tmp/karaoke-site.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/karaoke-site.tar.gz -C /tmp/karaoke-static
          cp -a /tmp/karaoke-static/karaoke public-karaoke
          test -f public-karaoke/index.html
          test -f public-karaoke/app.js
          test -f public-karaoke/songs.js
      - name: Commit generated static files
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-karaoke
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish mobile karaoke static site"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify public HTML gateway
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.commit.outputs.sha }}"
          URL="https://raw.githack.com/${GITHUB_REPOSITORY}/${SHA}/public-karaoke/index.html"
          ok=0
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error --max-time 30 "$URL" -o /tmp/index.html && grep -q "韓国語カラオケ練習" /tmp/index.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          curl --fail --location --silent --show-error --max-time 30 "https://raw.githack.com/${GITHUB_REPOSITORY}/${SHA}/public-karaoke/app.js" -o /tmp/app.js
          curl --fail --location --silent --show-error --max-time 30 "https://raw.githack.com/${GITHUB_REPOSITORY}/${SHA}/public-karaoke/songs.js" -o /tmp/songs.js
          node --check /tmp/app.js
          node --check /tmp/songs.js
          echo "Verified: $URL"
