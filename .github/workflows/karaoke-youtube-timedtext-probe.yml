name: Karaoke YouTube timed-text probe

on:
  push:
    paths:
      - "karaoke/probe_youtube_timedtext.py"
      - ".github/workflows/karaoke-youtube-timedtext-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --upgrade requests
      - name: Probe public timed-text endpoints
        run: python karaoke/probe_youtube_timedtext.py
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-youtube-timedtext-probe
          path: karaoke/youtube-timedtext-output/probe.json
          if-no-files-found: error
          retention-days: 1
