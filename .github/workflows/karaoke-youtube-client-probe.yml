name: Karaoke YouTube client probe

on:
  push:
    paths:
      - "karaoke/probe_youtube_clients.py"
      - ".github/workflows/karaoke-youtube-client-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Probe alternate YouTube clients
        run: python karaoke/probe_youtube_clients.py
      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-youtube-client-probe
          path: karaoke/youtube-client-output/probe.json
          if-no-files-found: error
          retention-days: 1
