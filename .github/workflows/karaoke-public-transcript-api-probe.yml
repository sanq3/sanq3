name: Karaoke public transcript API probe

on:
  push:
    paths:
      - "karaoke/probe_public_transcript_apis.py"
      - ".github/workflows/karaoke-public-transcript-api-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --upgrade requests
      - name: Query public transcript services
        run: python karaoke/probe_public_transcript_apis.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-public-transcript-api-output
          path: karaoke/public-transcript-api-output
          if-no-files-found: error
          retention-days: 2
